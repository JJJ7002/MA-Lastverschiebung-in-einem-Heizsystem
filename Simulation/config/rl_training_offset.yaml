# Training of the offset agent (control.method reinforcement_learning_offset). Start with:  python train_rl.py --config config/rl_training_offset.yaml
# The agent only shifts the heating-circuit set-point ("WP HK") every control interval; the normal
# heating curve determines the heat-pump power. Actions, observation options and model path are set in
# plant_config under control.reinforcement_learning_offset.
agent: offset
plant_config: default.yaml # Path relative to this file

training:
  timesteps: 400000 # Number of control decisions
  episode_days: 14 # Length of one training episode (random start inside the training period)
  seed: 42
  eval_every: 25000 # Decisions between validation runs
  validation_windows: 8 # Number of evenly spread validation windows per run; null = the whole validation period
  validation_window_days: 7 # Length of one validation window (only with validation_windows)
  n_envs: 1 # Parallel environments (processes); > 1 needs several free CPU cores

periods:
  training:
    start_time: "2020-08-01 00:00"
    end_time: "2024-08-01 00:00"
  validation: # The checkpoint with the best validation score becomes the model. null = same as training
    start_time: "2024-08-01 00:00"
    end_time: "2025-08-01 00:00"

# DQN hyperparameters. All entries are optional; missing ones use DQN_DEFAULTS in learning/training.py.
dqn:
  net_arch: [64, 64]
  learning_rate: 0.0001
  buffer_size: 100000
  learning_starts: 1000
  batch_size: 64
  gamma: 0.995
  train_freq: 4
  gradient_steps: 1
  target_update_interval: 5000
  exploration_fraction: 0.3
  exploration_initial_eps: 1.0
  exploration_final_eps: 0.05

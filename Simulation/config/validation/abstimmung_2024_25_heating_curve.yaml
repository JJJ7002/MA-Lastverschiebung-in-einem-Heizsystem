# Coarse tuning of the heating_curve offset on the validation year 2024/25 (not on the evaluation year).
# Start: python run_experiments.py --config config/validation/abstimmung_2024_25_heating_curve.yaml --workers auto
base_config: ../default.yaml
output_dir: ../../results/validation/00_abstimmung_2024_25/heating_curve
save_time_series: false
parameters:
  control.method: [heating_curve]
  simulation.start_time: ["2024-08-01 00:00"]
  simulation.end_time: ["2025-08-01 00:00"]
  control.heating_curve.offset_K: [6.0, 7.0, 8.0, 9.0, 10.0]

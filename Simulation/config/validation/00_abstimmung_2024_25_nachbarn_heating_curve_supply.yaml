# Tuning of heating_curve_supply on the RL validation period (2024-08-01 to 2025-08-01), not on the evaluation year.
# Shows that the chosen values score better than the neighbouring values and combinations.
# Start: python run_experiments.py --config config/validation/00_abstimmung_2024_25_nachbarn_heating_curve_supply.yaml --workers auto
base_config: ../default.yaml
output_dir: ../../results/validation/00_abstimmung_2024_25_nachbarn/heating_curve_supply
save_time_series: false
parameters:
  control.method: [heating_curve_supply]
  simulation.start_time: ["2024-08-01 00:00"]
  simulation.end_time: ["2025-08-01 00:00"]
  control.heating_curve_supply.offset_K: [6.0, 7.0, 8.0]
  control.heating_curve_supply.slope_factor: [0.65, 0.70, 0.75]
